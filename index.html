<title>Silver Birch Farm</title>
<meta name="description" content="Silver Birch Farm, Short Tract, New York. Andrews Wildlife Art and Edge of the Field.">

<style>
/*
VOICE: quiet, archival, a family place
IDEA: a mounted photograph in an album, with its handwritten label underneath
PICTURE: the original farm photograph, large, edge to edge
COLOUR and TYPE: paper white and graphite ink, one spruce green; Instrument Serif name, Source Sans body
LAYOUT: photo first, the name below it, then two links as plain rows
*/
:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#121412);--ink:light-dark(#1d1f1c,#e9e7e1);--soft:light-dark(#5c605a,#a9ada6);--rule:light-dark(#dcdad3,#2c302b);--green:light-dark(#2f4a3c,#9fc2ad)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
.photo{margin:0;background:#2a2a28}
.photo img{display:block;width:100%;height:auto;max-height:78vh;object-fit:cover;object-position:50% 62%;filter:sepia(.12) contrast(1.02)}
main{max-width:760px;margin:0 auto;padding:clamp(28px,5vw,60px) max(5vw,20px) 40px}
h1{font:400 clamp(44px,8vw,72px)/1.02 "Instrument Serif",Georgia,serif;margin:0;text-wrap:balance}
.place{margin:.35em 0 0;color:var(--soft);font-size:18px}
.links{list-style:none;margin:clamp(28px,5vw,48px) 0 0;padding:0;border-top:1px solid var(--rule)}
.links li{border-bottom:1px solid var(--rule)}
.links a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:20px 4px;min-height:44px;color:inherit;text-decoration:none}
.links b{font:400 30px/1.1 "Instrument Serif",Georgia,serif;color:var(--green)}
.links span{grid-column:1;color:var(--soft);font-size:16px}
.links i{grid-row:1/3;grid-column:2;font-style:normal;font-size:24px;color:var(--green);transition:transform .2s}
.links a:hover i,.links a:focus-visible i{transform:translateX(4px)}
.links a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
footer{max-width:760px;margin:0 auto;padding:0 max(5vw,20px) 48px;color:var(--soft);font-size:14px}
@media (prefers-reduced-motion:reduce){.links i{transition:none}}
</style>
</head>
